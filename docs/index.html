  .mobile-detail-stats { color: var(--sub); font-size: var(--font-sm); white-space: normal; }

  .mobile-champion {
    display: flex;

  @media (max-width: 640px) {
    body { padding: 8px; overflow: auto; height: auto; min-height: 100dvh; }
    .toolbar button { padding: 8px 12px; flex: 1 1 auto; min-height: 40px; }

    .tab-wrap > #tabClassic,

    #bracketContainer { overflow: visible; }

    .mobile-bracket-toolbar button { min-height: 40px; }
    .bracket-wrap { padding: 42px 4px 20px; -webkit-overflow-scrolling: touch; }
    .champion { margin-left: 12px; }
    .champion .trophy { width: 26px; height: 26px; }

    .tooltip-card { width: min(340px, calc(100vw - 24px)); }
    .site-header { gap: 8px; justify-content: flex-start; padding-left: 44px; }
    .brand-badge { width: 40px; height: 40px; }

    .hof-grid,

    .nav-toggle {

    #mainTabs {

    #mainTabs button[data-panel],

    .nav-drawer-head {

</style>
</head>
<body>

<script>
// Read-only display. Bracket JSON is produced server-side (cron / workflow) into docs/data/.

const SVG_NS = 'http://www.w3.org/2000/svg';
const BASE_DISPLAY_GW = 34;
const ROUND_STAGES = ['Qualifier', 'Round of 16', 'Quarterfinal', 'Semifinal', 'Final'];
const HIGHLIGHT_MATCHES = [9, 10];
const MOBILE_MQ = window.matchMedia('(max-width: 640px)');
const TIEBREAK_LABELS = {
  gw_points: 'Match Details',
  goals_scored: 'tied on points — won on goals scored',
  goals_conceded: 'tied on points+goals scored — won on fewer goals conceded',
  classic_rank: 'tied on points and goals — won on higher Classic league rank',
};

// Fixed vertical position for each match on an 8-row grid (from bracket_map shape).
const ROW_SPAN = {
  1: [1, 1], 9: [1, 1],
  5: [2, 2],
  2: [3, 3], 10: [3, 3],
  6: [4, 4],
  3: [5, 5], 11: [5, 5],
  7: [6, 6],
  4: [7, 7], 12: [7, 7],
  8: [8, 8],
  13: [1, 2], 14: [3, 4], 15: [5, 6], 16: [7, 8],
  17: [1, 4], 18: [5, 8],
  19: [1, 8],
};

const tooltipEl = document.createElement('div');
tooltipEl.className = 'tooltip-card';
tooltipEl.id = 'bracketTooltip';
tooltipEl.setAttribute('role', 'tooltip');
document.body.appendChild(tooltipEl);

const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function escapeHTML(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ESC_MAP[c]);
}

function clearScale(el) {
  el.style.transform = '';
  el.style.height = '';
  el.style.width = '';
  const wrap = el.querySelector?.('.bracket-wrap');
  if (wrap && wrap !== el) {
    wrap.style.transform = '';
    wrap.style.transformOrigin = '';
  }
}

function showTooltip(boxEl, html) {
  tooltipEl.innerHTML = html;
  tooltipEl.style.display = 'block';
  tooltipEl.classList.remove('arrow-top', 'arrow-bottom');

  const r = boxEl.getBoundingClientRect();
  const tw = tooltipEl.offsetWidth;
  const th = tooltipEl.offsetHeight;
  let left = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, window.innerWidth - tw - 8));
  let top = r.top - th - 12;
  if (top < 8) {
    top = r.bottom + 12;
    tooltipEl.classList.add('arrow-top');
  } else {
    tooltipEl.classList.add('arrow-bottom');
  }
  tooltipEl.style.setProperty('--arrow-x', `${r.left + r.width / 2 - left}px`);
  tooltipEl.style.left = `${left}px`;
  tooltipEl.style.top = `${top}px`;
  requestAnimationFrame(() => tooltipEl.classList.add('visible'));
}

function hideTooltip() {
  tooltipEl.classList.remove('visible');
  tooltipEl.style.display = 'none';
  delete tooltipEl.dataset.owner;
}

document.addEventListener('click', hideTooltip);

function sortedGws(state) {
  return [...new Set(Object.values(state).map((m) => m.gw))].sort((a, b) => a - b);
}

function buildRoundMeta(state) {
  const gwValues = sortedGws(state);
  const displayGw = {};
  const labels = {};
  gwValues.forEach((gw, i) => {
    const shown = BASE_DISPLAY_GW + i;
    displayGw[gw] = shown;
    labels[gw] = `${ROUND_STAGES[i] || `Round ${i + 1}`} (GW ${shown})`;
  });
  return { labels, displayGw, finalGw: gwValues[gwValues.length - 1] };
}

function buildChildrenMap(state) {
  const children = Object.fromEntries(Object.keys(state).map((no) => [no, []]));
  for (const [no, match] of Object.entries(state)) {
    for (const slot of match.slots) {
      if (typeof slot.seed === 'string' && slot.seed.startsWith('winner:')) {
        children[no].push(slot.seed.slice(7));
      }
    }
  }
  return children;
}

function findRoot(state, childrenMap) {
  const fed = new Set(Object.values(childrenMap).flat());
  return Object.keys(state).find((no) => !fed.has(no));
}

function buildTooltipHTML(m, shownGw) {
  if (!m.winner_entry_id || !m.tiebreak_detail) return '';
  const isGw34 = shownGw === 34;
  const nameFor = (entryId) => m.slots.find((s) => s.entry_id === entryId)?.team_name || 'Unknown';
  const row = (d) => {
    const isWinner = d.entry_id === m.winner_entry_id;
    const rank = d.classic_rank != null ? ` &nbsp; <span class="cr-value">CR ${d.classic_rank}</span>` : '';
    return `<div class="tt-row${isWinner && !isGw34 ? ' tt-winner' : ''}">
      <span class="tt-name">${isWinner && !isGw34 ? '🏆 ' : ''}${escapeHTML(nameFor(d.entry_id))}</span>
      <span class="tt-stats"><b>${d.gw_points}</b>pts &nbsp; <span class="stat-num">${d.goals_scored}</span><span class="stat-icon">⚽</span> &nbsp; <span class="stat-num">${d.goals_conceded}</span><span class="stat-icon">🥅</span>${rank}</span>
    </div>`;
  };
  const { entry_a, entry_b } = m.tiebreak_detail;
  return `<div class="tt-heading">${TIEBREAK_LABELS[m.tiebreak_reason] || m.tiebreak_reason}</div>${row(entry_a)}${row(entry_b)}`;
}

function scoreMap(m) {
  if (!m.tiebreak_detail) return null;
  const map = new Map();
  for (const side of [m.tiebreak_detail.entry_a, m.tiebreak_detail.entry_b]) {
    map.set(side.entry_id, side.gw_points);
  }
  return map;
}

function teamPresentation(slot, m, scores) {
  const isWinner = m.winner_entry_id && slot.entry_id === m.winner_entry_id;
  const isTbd = !slot.team_name;
  const isAdvanced = slot.seed.startsWith('winner:') && !!slot.team_name;
  const name = slot.team_name || (slot.seed.startsWith('winner:') ? 'TBD' : slot.seed);
  const cls = [isWinner ? 'winner' : isTbd ? 'tbd' : '', isAdvanced ? 'advanced' : ''].filter(Boolean).join(' ');
  const score = scores?.get(slot.entry_id);
  const advancedTag = isAdvanced ? '<span class="advanced-tag" title="Advanced from previous round">▲</span>' : '';
  const managerHTML = slot.manager ? ` <span class="manager-name">(${escapeHTML(slot.manager)})</span>` : '';
  return { cls, score, name, advancedTag, managerHTML };
}

function teamRowHTML(slot, m, scores) {
  const { cls, score, name, advancedTag, managerHTML } = teamPresentation(slot, m, scores);
  const scoreHTML = score != null ? `<span class="score">${score}</span>` : '';
  return `<div class="team ${cls}"><div class="team-main"><div class="team-name">${advancedTag}${escapeHTML(name)}${managerHTML}</div></div>${scoreHTML}</div>`;
}

function mobileTeamRowHTML(slot, m, scores) {
  const { cls, score, name, advancedTag, managerHTML } = teamPresentation(slot, m, scores);
  const scoreHTML = score != null ? `<span class="mobile-team-score">${score}</span>` : '';
  return `<span class="mobile-team ${cls}"><span class="mobile-team-name">${advancedTag}${escapeHTML(name)}${managerHTML}</span>${scoreHTML}</span>`;
}

function matchBoxHTML(matchNo, m, shownGw) {
  const scores = scoreMap(m);
  const liveTag = m.provisional ? ' <span class="live-tag">LIVE</span>' : '';
  return `<div class="match-box" data-match="${matchNo}" data-gw="${m.gw}">
    <div class="label">M${matchNo} - GW${shownGw}${liveTag}</div>
    ${teamRowHTML(m.slots[0], m, scores)}
    ${teamRowHTML(m.slots[1], m, scores)}
  </div>`;
}

function mobileMatchDetailsHTML(m) {
  if (!m.tiebreak_detail) {
    return '<div class="mobile-match-details"><p class="mobile-detail-empty">Match details will appear after the Gameweek updates.</p></div>';
  }
  const row = (detail) => {
    const slot = m.slots.find((item) => item.entry_id === detail.entry_id);
    const team = slot?.team_name || 'Unknown';
    const manager = slot?.manager ? ` (${escapeHTML(slot.manager)})` : '';
    const rank = detail.classic_rank != null ? ` · <span class="cr-value">CR ${detail.classic_rank}</span>` : '';
    const winnerClass = detail.entry_id === m.winner_entry_id ? ' winner' : '';
    const winnerIcon = winnerClass ? '🏆 ' : '';
    return `<div class="mobile-detail-row${winnerClass}">
      <span class="mobile-detail-name">${winnerIcon}${escapeHTML(team)}${manager}</span>
      <span class="mobile-detail-stats">${detail.gw_points} pts · <span class="stat-num">${detail.goals_scored}</span><span class="stat-icon">⚽</span> · <span class="stat-num">${detail.goals_conceded}</span><span class="stat-icon">🥅</span>${rank}</span>
    </div>`;
  };
  const { entry_a, entry_b } = m.tiebreak_detail;
  const heading = TIEBREAK_LABELS[m.tiebreak_reason] || m.tiebreak_reason;
  return `<div class="mobile-match-details"><div class="mobile-detail-heading">${escapeHTML(heading)}</div>${row(entry_a)}${row(entry_b)}</div>`;
}

function mobileMatchCardHTML(matchNo, m, shownGw, isOpen) {
  const scores = scoreMap(m);
  const liveTag = m.provisional ? ' <span class="live-tag">LIVE</span>' : '';
  return `<details class="mobile-match-card" data-match="${matchNo}"${isOpen ? ' open' : ''}>
    <summary aria-label="M${matchNo} GW${shownGw} match details">
      <span class="mobile-match-label">M${matchNo} - GW${shownGw}${liveTag}</span>
      ${mobileTeamRowHTML(m.slots[0], m, scores)}
      ${mobileTeamRowHTML(m.slots[1], m, scores)}
    </summary>
    ${mobileMatchDetailsHTML(m)}
  </details>`;
}

function bindTooltip(boxEl, matchNo, html) {
  boxEl.classList.add('has-tooltip');
  boxEl.tabIndex = 0;
  boxEl.setAttribute('aria-describedby', 'bracketTooltip');
  const open = () => showTooltip(boxEl, html);
  boxEl.addEventListener('mouseenter', open);
  boxEl.addEventListener('mouseleave', hideTooltip);
  boxEl.addEventListener('focus', open);
  boxEl.addEventListener('blur', hideTooltip);
  boxEl.addEventListener('click', (e) => {
    e.stopPropagation();
    if (tooltipEl.style.display === 'block' && tooltipEl.dataset.owner === matchNo) {
      hideTooltip();
    } else {
      open();
      tooltipEl.dataset.owner = matchNo;
    }
  });
}

function renderBracketGrid(state, roundMeta) {
  const colIndex = Object.fromEntries(sortedGws(state).map((gw, i) => [gw, i + 1]));
  const grid = document.createElement('div');
  grid.className = 'bracket-grid';
  const frag = document.createDocumentFragment();

  for (const no of HIGHLIGHT_MATCHES) {
    if (!state[no]) continue;
    const [rowStart, rowEnd] = ROW_SPAN[no] || [1, 1];
    const band = document.createElement('div');
    band.className = 'row-highlight';
    band.style.gridColumn = '1 / -1';
    band.style.gridRow = `${rowStart} / ${rowEnd + 1}`;
    frag.appendChild(band);
  }

  const tpl = document.createElement('template');
  for (const matchNo of Object.keys(state)) {
    const m = state[matchNo];
    const [rowStart, rowEnd] = ROW_SPAN[matchNo] || [1, 1];
    tpl.innerHTML = matchBoxHTML(matchNo, m, roundMeta.displayGw[m.gw]).trim();
    const boxEl = tpl.content.firstElementChild;
    boxEl.style.gridColumn = String(colIndex[m.gw]);
    boxEl.style.gridRow = `${rowStart} / ${rowEnd + 1}`;
    const tip = buildTooltipHTML(m, roundMeta.displayGw[m.gw]);
    if (tip) bindTooltip(boxEl, matchNo, tip);
    frag.appendChild(boxEl);
  }

  grid.appendChild(frag);
  return grid;
}

function trophySVG(size, gradId) {
  return `<svg class="trophy" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">
    <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a" /><stop offset="1" stop-color="#d9a521" />
    </linearGradient></defs>
    <path d="M6 4h12v3a6 6 0 0 1-6 6 6 6 0 0 1-6-6V4Z" fill="url(#${gradId})" stroke="#c9971f" stroke-width="0.5" />
    <path d="M6 5H3v2a4 4 0 0 0 4 4" stroke="#c9971f" stroke-width="1.2" fill="none" />
    <path d="M18 5h3v2a4 4 0 0 1-4 4" stroke="#c9971f" stroke-width="1.2" fill="none" />
    <rect x="10" y="13" width="4" height="4" fill="#d9a521" />
    <rect x="7" y="18" width="10" height="2.4" rx="1" fill="#d9a521" />
  </svg>`;
}

function measureBracket(wrap, treeEl) {
  const wrapRect = wrap.getBoundingClientRect();
  const rectsByMatch = new Map();
  for (const box of treeEl.querySelectorAll('.match-box')) {
    const r = box.getBoundingClientRect();
    rectsByMatch.set(box.dataset.match, {
      left: r.left - wrapRect.left,
      right: r.right - wrapRect.left,
      top: r.top - wrapRect.top,
      width: r.width,
      cy: r.top - wrapRect.top + r.height / 2,
      gw: box.dataset.gw,
    });
  }
  return { scrollWidth: treeEl.scrollWidth, scrollHeight: treeEl.scrollHeight, rectsByMatch };
}

function drawConnectors(svg, childrenMap, measurements, state) {
  const { scrollWidth, scrollHeight, rectsByMatch } = measurements;
  svg.setAttribute('width', scrollWidth);
  svg.setAttribute('height', scrollHeight);
  const frag = document.createDocumentFragment();
  for (const [parentNo, kids] of Object.entries(childrenMap)) {
    const parentPos = rectsByMatch.get(parentNo);
    if (!parentPos) continue;
    for (const childNo of kids) {
      const childPos = rectsByMatch.get(childNo);
      if (!childPos) continue;
      const midX = (childPos.right + parentPos.left) / 2;
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', `M ${childPos.right} ${childPos.cy} H ${midX} V ${parentPos.cy} H ${parentPos.left}`);
      if (state[childNo]?.provisional) path.classList.add('live');
      frag.appendChild(path);
    }
  }
  svg.replaceChildren(frag);
}

function drawRoundHeaders(headerEl, measurements, roundMeta) {
  const frag = document.createDocumentFragment();
  const seenGw = new Set();
  for (const pos of measurements.rectsByMatch.values()) {
    if (seenGw.has(pos.gw)) continue;
    seenGw.add(pos.gw);
    const gw = Number(pos.gw);
    const span = document.createElement('span');
    if (gw === roundMeta.finalGw) span.classList.add('round-final');
    span.style.left = `${pos.left + pos.width / 2}px`;
    span.textContent = roundMeta.labels[gw] || `GW ${gw}`;
    frag.appendChild(span);
  }
  headerEl.replaceChildren(frag);
}

function drawFinalTopper(wrap, measurements, rootNo) {
  wrap.querySelector('.final-topper')?.remove();
  const pos = measurements.rectsByMatch.get(rootNo);
  if (!pos) return;
  const topper = document.createElement('div');
  topper.className = 'final-topper';
  topper.innerHTML = `${trophySVG(22, 'finalTrophyGrad')}<span>Final</span>`;
  wrap.appendChild(topper);
  topper.style.left = `${pos.left + pos.width / 2}px`;
  topper.style.top = `${pos.top - topper.offsetHeight - 6}px`;
  topper.style.transform = 'translateX(-50%)';
}

function fitBracketToViewport(container) {
  clearScale(container);
  if (MOBILE_MQ.matches) return;
  const wrap = container.querySelector('.bracket-wrap');
  if (!wrap) return;
  const available = window.innerHeight - container.getBoundingClientRect().top - 8;
  const naturalH = wrap.scrollHeight;
  if (naturalH <= 0 || available <= 0) return;
  const scale = Math.min(1, available / naturalH);
  if (scale === 1) return;
  wrap.style.transformOrigin = 'top left';
  wrap.style.transform = `scale(${scale})`;
}

function renderFullBracket(container, state) {
  clearScale(container);
  if (!state) {
    container.innerHTML = '<div class="empty">No data available.</div>';
    return;
  }

  const childrenMap = buildChildrenMap(state);
  const rootNo = findRoot(state, childrenMap);
  const roundMeta = buildRoundMeta(state);

  const headers = document.createElement('div');
  headers.className = 'round-headers';

  const wrap = document.createElement('div');
  wrap.className = 'bracket-wrap';
  const grid = renderBracketGrid(state, roundMeta);
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('class', 'connectors');
  wrap.append(headers, svg, grid);

  const finalMatch = state[rootNo];
  if (finalMatch?.winner_entry_id) {
    const name = finalMatch.slots.find((s) => s.entry_id === finalMatch.winner_entry_id)?.team_name;
    if (name) {
      const champ = document.createElement('div');
      champ.className = 'champion';
      champ.innerHTML = `${trophySVG(34, 'trophyGrad')}<span class="name">${escapeHTML(name)}</span>`;
      wrap.appendChild(champ);
    }
  }

  container.replaceChildren(wrap);

  requestAnimationFrame(() => {
    const measurements = measureBracket(wrap, grid);
    drawConnectors(svg, childrenMap, measurements, state);
    drawRoundHeaders(headers, measurements, roundMeta);
    drawFinalTopper(wrap, measurements, rootNo);
    fitBracketToViewport(container);
  });
}

function renderMobileRoundBracket(container, state) {
  clearScale(container);
  const roundMeta = buildRoundMeta(state);
  const rounds = sortedGws(state);
  const index = Math.min(mobileRoundIndex[currentLeague] || 0, rounds.length - 1);
  const gw = rounds[index];
  mobileRoundIndex[currentLeague] = index;
  const matches = Object.entries(state)
    .filter(([, match]) => match.gw === gw)
    .sort(([a], [b]) => Number(a) - Number(b));
  const tabs = rounds.map((roundGw, roundIndex) => {
    const active = roundIndex === index ? ' class="active"' : '';
    return `<button type="button" data-round-index="${roundIndex}"${active}>GW${roundMeta.displayGw[roundGw]}</button>`;
  }).join('');
  const openMatches = mobileOpenMatches[currentLeague];
  const cards = matches.map(([matchNo, match]) => (
    mobileMatchCardHTML(matchNo, match, roundMeta.displayGw[gw], openMatches.has(matchNo))
  )).join('');
  const shell = document.createElement('div');
  shell.className = 'mobile-bracket-shell';
  shell.innerHTML = `
    <div class="mobile-bracket-toolbar">
      <div class="mobile-bracket-actions"><button type="button" data-bracket-view="full">View Full Bracket</button></div>
      <div class="mobile-round-nav">
        <button type="button" data-round-step="-1" aria-label="Previous round"${index === 0 ? ' disabled' : ''}>‹</button>
        <span class="mobile-round-label">${escapeHTML(roundMeta.labels[gw])}</span>
        <button type="button" data-round-step="1" aria-label="Next round"${index === rounds.length - 1 ? ' disabled' : ''}>›</button>
      </div>
      <div class="mobile-round-tabs" role="tablist" aria-label="Knockout rounds">${tabs}</div>
    </div>
    <div class="mobile-round-list">${cards}</div>`;

  const childrenMap = buildChildrenMap(state);
  const rootNo = findRoot(state, childrenMap);
  const finalMatch = state[rootNo];
  if (gw === roundMeta.finalGw && finalMatch?.winner_entry_id) {
    const winner = finalMatch.slots.find((slot) => slot.entry_id === finalMatch.winner_entry_id);
    if (winner?.team_name) {
      const manager = winner.manager ? ` (${escapeHTML(winner.manager)})` : '';
      shell.insertAdjacentHTML('beforeend', `<div class="mobile-champion">${trophySVG(28, 'mobileTrophyGrad')}<span>${escapeHTML(winner.team_name)}${manager}</span></div>`);
    }
  }
  container.replaceChildren(shell);

  const changeRound = (nextIndex) => {
    if (nextIndex < 0 || nextIndex >= rounds.length) return;
    mobileRoundIndex[currentLeague] = nextIndex;
    renderBracket(container, state);
  };
  shell.querySelector('[data-bracket-view="full"]').addEventListener('click', () => {
    mobileBracketMode = 'full';
    renderBracket(container, state);
  });
  shell.querySelectorAll('[data-round-index]').forEach((button) => {
    button.addEventListener('click', () => changeRound(Number(button.dataset.roundIndex)));
  });
  shell.querySelectorAll('[data-round-step]').forEach((button) => {
    button.addEventListener('click', () => changeRound(index + Number(button.dataset.roundStep)));
  });

  shell.querySelectorAll('.mobile-match-card').forEach((card) => {
    const summary = card.querySelector('summary');
    summary.addEventListener('click', (e) => {
      e.preventDefault();
      card.open = !card.open;
      if (card.dataset.match) {
        if (card.open) openMatches.add(card.dataset.match);
        else openMatches.delete(card.dataset.match);
      }
      summary.focus({ preventScroll: true });
    });
  });

  const list = shell.querySelector('.mobile-round-list');
  let touchStartX = 0;
  let touchStartY = 0;
  list.addEventListener('touchstart', (event) => {
    touchStartX = event.changedTouches[0].clientX;
    touchStartY = event.changedTouches[0].clientY;
  }, { passive: true });
  list.addEventListener('touchend', (event) => {
    const deltaX = event.changedTouches[0].clientX - touchStartX;
    const deltaY = event.changedTouches[0].clientY - touchStartY;
    if (Math.abs(deltaX) < 50 || Math.abs(deltaX) <= Math.abs(deltaY)) return;
    changeRound(index + (deltaX < 0 ? 1 : -1));
  }, { passive: true });
}

function renderMobileFullBracket(container, state) {
  renderFullBracket(container, state);
  const toolbar = document.createElement('div');
  toolbar.className = 'mobile-bracket-toolbar';
  toolbar.innerHTML = '<div class="mobile-bracket-actions"><button type="button">Round View</button></div>';
  toolbar.querySelector('button').addEventListener('click', () => {
    mobileBracketMode = 'round';
    renderBracket(container, state);
  });
  container.prepend(toolbar);
}

function renderBracket(container, state) {
  hideTooltip();
  if (!state) {
    clearScale(container);
    container.innerHTML = currentLeague === 'h2h'
      ? '<div class="empty bracket-empty"><strong>Diogo Legacy bracket opens after GW33.</strong><span>H2H qualification and knockout matchups will appear here when that competition becomes active.</span></div>'
      : '<div class="empty bracket-empty"><strong>Bracket data is not available yet.</strong><span>Matchups will appear here after qualification data is generated.</span></div>';
    return;
  }
  if (!MOBILE_MQ.matches) {
    renderFullBracket(container, state);
    return;
  }
  if (mobileBracketMode === 'full') {
    renderMobileFullBracket(container, state);
    return;
  }
  renderMobileRoundBracket(container, state);
}

function sortStandingsRows(rows, league) {
  const { key, dir } = standingsSort[league];
  const sign = dir === 'asc' ? 1 : -1;
  return [...rows].sort((a, b) => {
    let av = a[key];
    let bv = b[key];
    if (key === 'manager') { av = av.toLowerCase(); bv = bv.toLowerCase(); }
    if (av < bv) return -1 * sign;
    if (av > bv) return 1 * sign;
    return a.rank - b.rank;
  });
}

function computeHallOfFame(clusters) {
  const counts = new Map();
  for (const cluster of clusters) {
    for (const group of cluster.groups) {
      if (!HOF_LEAGUES.has(group.title)) continue;
      for (const row of group.rows) {
        for (const name of row[1].split('&').map((n) => n.trim()).filter(Boolean)) {
          counts.set(name, (counts.get(name) || 0) + 1);
        }
      }
    }
  }
  return [...counts.entries()].sort((a, b) => b[1] - a[1]);
}

  const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  if (!inside) winnerCardDialog.close();
});

const WINNER_POSTER_SIZE = 1200;
const winnerTemplateImage = new Image();
winnerTemplateImage.decoding = 'async';
winnerTemplateImage.src = 'winnertemp.png?v=20260901manager';
let winnerTemplateLoadPromise;
let winnerCopyStatusTimer;
let preparedWinnerBlob;
let winnerShareFallbackReady = false;
let braveBrowserDetected = false;
const isIOSAlternativeBrowser = /iP(?:hone|ad|od)/.test(navigator.userAgent)
  && /(?:CriOS|FxiOS|EdgiOS|OPiOS|Brave)/.test(navigator.userAgent);

if (navigator.brave?.isBrave) {
  Promise.resolve(navigator.brave.isBrave()).then((isBrave) => {
    braveBrowserDetected = Boolean(isBrave);
  }).catch(() => {});
}

function loadWinnerTemplateImage() {
  if (winnerTemplateImage.complete && winnerTemplateImage.naturalWidth) return Promise.resolve(winnerTemplateImage);
  if (!winnerTemplateLoadPromise) {
    winnerTemplateLoadPromise = new Promise((resolve, reject) => {
      winnerTemplateImage.addEventListener('load', () => resolve(winnerTemplateImage), { once: true });
      winnerTemplateImage.addEventListener('error', () => reject(new Error('Winner template image failed to load.')), { once: true });
    });
  }
  return winnerTemplateLoadPromise;
}

function drawWinnerPanel(ctx, data) {
  ctx.save();
  const banner = ctx.createLinearGradient(210, 0, 990, 0);
  banner.addColorStop(0, '#83ff00');
  banner.addColorStop(1, '#00e7df');
  ctx.fillStyle = banner;
  ctx.beginPath();
  ctx.moveTo(226, 696);
  ctx.lineTo(974, 696);
  ctx.quadraticCurveTo(990, 696, 990, 712);
  ctx.lineTo(990, 756);
  ctx.quadraticCurveTo(990, 772, 974, 772);
  ctx.lineTo(226, 772);
  ctx.quadraticCurveTo(210, 772, 210, 756);
  ctx.lineTo(210, 712);
  ctx.quadraticCurveTo(210, 696, 226, 696);
  ctx.closePath();
  ctx.fill();

  const managerText = data.manager.toUpperCase();
  let managerSize = 64;
  do {
    ctx.font = `italic 900 ${managerSize}px "Arial Black", Arial, sans-serif`;
    if (ctx.measureText(managerText).width <= 760) break;
    managerSize -= 2;
  } while (managerSize > 28);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#08001f';
  ctx.fillText(managerText, 600, 734);

  ctx.font = '600 23px Arial, sans-serif';
  ctx.fillStyle = 'rgba(255, 255, 255, 0.78)';
  ctx.fillText(data.team, 600, 798);

  ctx.fillStyle = '#ffffff';
  ctx.font = '800 22px Arial, sans-serif';
  ctx.fillText(data.kind === 'mom' ? 'MONTH' : 'GAMEWEEK', 333, 852);
  ctx.fillText(data.kind === 'mom' ? 'POINTS' : 'GW POINTS', 601, 852);

  ctx.fillStyle = '#79ff00';
  ctx.font = '900 42px Arial, sans-serif';
  ctx.fillText(data.kind === 'mom' ? data.period : `GW ${data.period}`, 333, 900);
  ctx.fillStyle = '#00e7df';
  ctx.fillText(`${data.points} PTS`, 601, 900);
  ctx.restore();
}

function drawMonthHeading(ctx) {
  const glow = ctx.createRadialGradient(600, 485, 40, 600, 485, 560);
  glow.addColorStop(0, '#17003d');
  glow.addColorStop(0.72, '#0d0227');
  glow.addColorStop(1, 'rgba(8, 0, 31, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(60, 382, 1080, 210);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'italic 900 145px Impact, "Arial Black", sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('MONTH', 370, 490);
  ctx.fillStyle = '#79ff00';
  ctx.fillText('WINNER', 835, 490);
}

async function createWinnerPosterBlob() {
  const image = await loadWinnerTemplateImage();
  const poster = winnerCardDialog.querySelector('.winner-poster');
  const canvas = document.createElement('canvas');
  canvas.width = WINNER_POSTER_SIZE;
  canvas.height = WINNER_POSTER_SIZE;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(image, 0, 0, WINNER_POSTER_SIZE, WINNER_POSTER_SIZE);
  if (poster.dataset.kind === 'mom') drawMonthHeading(ctx);
  drawWinnerPanel(ctx, poster.dataset);
  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('Could not create the winner image.')), 'image/png');
  });
}

function showWinnerCopyStatus(message) {
  const status = winnerCardDialog.querySelector('.winner-copy-status');
  status.textContent = message;
  status.classList.add('visible');
  clearTimeout(winnerCopyStatusTimer);
  winnerCopyStatusTimer = setTimeout(() => status.classList.remove('visible'), 2200);
}

function winnerShareFile() {
  const poster = winnerCardDialog.querySelector('.winner-poster');
  const period = poster.dataset.kind === 'mom' ? poster.dataset.period : `gw-${poster.dataset.period}`;
  return new File([preparedWinnerBlob], `poky-fpl-winner-${period}.png`, { type: 'image/png' });
}

function canShareWinnerFile(file) {
  if (!navigator.share) return false;
  try {
    return !navigator.canShare || navigator.canShare({ files: [file] });
  } catch {
    return false;
  }
}

async function shareWinnerImage() {
  const file = winnerShareFile();
  if (!canShareWinnerFile(file)) {
    showWinnerCopyStatus('Image sharing is not supported in this browser.');
    return;
  }
  try {
    await navigator.share({ files: [file], title: 'Poky FPL winner' });
    showWinnerCopyStatus('Image shared.');
  } catch (error) {
    if (error.name !== 'AbortError') {
      console.error('Winner image share failed:', error);
      showWinnerCopyStatus('Could not share image.');
    }
  }
}

winnerCardDialog.querySelector('.winner-card-copy').addEventListener('click', async () => {
  const button = winnerCardDialog.querySelector('.winner-card-copy');
  if (!preparedWinnerBlob) {
    showWinnerCopyStatus('Image is still preparing…');
    return;
  }
  if (winnerShareFallbackReady || isIOSAlternativeBrowser || braveBrowserDetected) {
    await shareWinnerImage();
    return;
  }
  if (!navigator.clipboard?.write || !window.ClipboardItem) {
    winnerShareFallbackReady = true;
    await shareWinnerImage();
    return;
  }
  button.disabled = true;
  showWinnerCopyStatus('Copying image…');
  try {
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': Promise.resolve(preparedWinnerBlob) })]);
    showWinnerCopyStatus('Image copied.');
  } catch (error) {
    console.error('Winner image copy failed:', error);
    winnerShareFallbackReady = true;
    button.title = 'Share image';
    button.setAttribute('aria-label', 'Share winner card image');
    showWinnerCopyStatus('Copy blocked here. Tap again to share.');
  } finally {
    button.disabled = false;
  }
});

function prepareWinnerImage() {
  const button = winnerCardDialog.querySelector('.winner-card-copy');
  const status = winnerCardDialog.querySelector('.winner-copy-status');
  preparedWinnerBlob = null;
  winnerShareFallbackReady = false;
  button.disabled = true;
  const usesShareSheet = isIOSAlternativeBrowser || braveBrowserDetected;
  button.title = usesShareSheet ? 'Copy or share image' : 'Copy image';
  button.setAttribute('aria-label', usesShareSheet ? 'Share winner card image' : 'Copy winner card image');
  status.classList.remove('visible');
  createWinnerPosterBlob().then((blob) => {
    preparedWinnerBlob = blob;
    button.disabled = false;
  }).catch((error) => {
    console.error('Winner image preparation failed:', error);
    showWinnerCopyStatus('Could not prepare image.');
  });
}

function scaleWinnerPoster() {
  const viewportWidth = window.visualViewport?.width || window.innerWidth;
  const viewportHeight = window.visualViewport?.height || window.innerHeight;
  const scale = Math.min(1, (viewportWidth - 16) / 1200, (viewportHeight - 16) / 1200);
  const poster = winnerCardDialog.querySelector('.winner-poster');
  const wrap = winnerCardDialog.querySelector('.winner-poster-scale');
  poster.style.transform = `scale(${scale})`;
  wrap.style.width = `${1200 * scale}px`;
  wrap.style.height = `${1200 * scale}px`;
}
window.addEventListener('resize', () => {
  if (winnerCardDialog.open) scaleWinnerPoster();
});
window.visualViewport?.addEventListener('resize', () => {
  if (winnerCardDialog.open) scaleWinnerPoster();
});

function renderWinnerCard(trigger) {
  const team = trigger.dataset.team;
  const manager = trigger.dataset.manager;
  const points = trigger.dataset.points;
  const kind = trigger.dataset.kind;
  const period = trigger.dataset.period;

  const poster = winnerCardDialog.querySelector('.winner-poster');
  poster.classList.add('reference-layout');
  poster.classList.toggle('month-layout', kind === 'mom');
  poster.dataset.team = team;
  poster.dataset.manager = manager;
  poster.dataset.points = points;
  poster.dataset.kind = kind;
  poster.dataset.period = period;

  winnerCardDialog.querySelector('.gw-title').textContent = kind === 'mom' ? 'MONTH' : 'GW';

  const nameEl = winnerCardDialog.querySelector('.winner-name');
  const teamEl = winnerCardDialog.querySelector('.winner-name-team');
  const initialNameSize = 64;
  teamEl.style.fontSize = `${initialNameSize}px`;
  teamEl.textContent = manager;
  winnerCardDialog.querySelector('.winner-name-manager').textContent = team;

  const stat1Label = winnerCardDialog.querySelector('.wp-stat1-label');
  const stat1Value = winnerCardDialog.querySelector('.wp-stat1-value');
  const stat2Label = winnerCardDialog.querySelector('.wp-stat2-label');
  const stat2Value = winnerCardDialog.querySelector('.wp-stat2-value');
  if (kind === 'mom') {
    stat1Label.textContent = 'MONTH';
    stat1Value.textContent = period;
    stat2Label.textContent = 'POINTS';
    stat2Value.textContent = `${points} PTS`;
  } else {
    stat1Label.textContent = 'GAMEWEEK';
    stat1Value.textContent = `GW ${period}`;
    stat2Label.textContent = 'GW POINTS';
    stat2Value.textContent = `${points} PTS`;
  }

  winnerCardDialog.showModal();
  scaleWinnerPoster();

  // Shrink the manager name until manager+team together fit the panel, so a
  // long manager name never overflows the fixed 1200px poster.
  let fontSize = initialNameSize;
  while (nameEl.scrollHeight > nameEl.clientHeight + 4 && fontSize > 20) {
    fontSize -= 2;
    teamEl.style.fontSize = `${fontSize}px`;
  }
  prepareWinnerImage();
}

function computeManagerTitles(name) {
  const titles = [];
  for (const cluster of CHAMPIONS_CLUSTERS) {
    for (const group of cluster.groups) {
      for (const row of group.rows) {
        const champs = row[1].split('&').map((n) => n.trim());
        if (champs.includes(name)) titles.push({ league: group.title, year: row[0], counts: HOF_LEAGUES.has(group.title) });
      }
    }
  }
  titles.sort((a, b) => b.year.localeCompare(a.year));
  return titles;
}

function renderManagerProfile(name) {
  const titles = computeManagerTitles(name);
  const titleCount = titles.filter((t) => t.counts).length;
  const titleRows = titles.length
    ? titles.map((t) => `<div class="profile-title-row">${champTrophyIcon(15)}<span>${escapeHTML(t.league)} — ${escapeHTML(t.year)}</span></div>`).join('')
    : '<p class="profile-empty">No titles on record yet.</p>';

  profileDialog.querySelector('.profile-body').innerHTML = `
    <h2 class="profile-name">${escapeHTML(name)}</h2>
    <div class="profile-total">${champTrophyIcon(16)}<span>${titleCount} career title${titleCount === 1 ? '' : 's'}</span></div>
    <h3 class="profile-section-heading">All-Time Titles</h3>
    ${titleRows}
    <p class="profile-footnote">Only Classic, H2H, Poky FPL Cup, Jota Legends, and Diogo Legacy count toward the title total.</p>`;
  profileDialog.showModal();
}

function renderSeasonHistoryProfile(entryId, name) {
  const entry = seasonHistoryData?.entries?.[entryId];
  const seasons = entry?.seasons || [];
  const rows = seasons.length
    ? seasons.map((s) => `<div class="profile-season-row">
        <span class="profile-season-name">${escapeHTML(s.season_name)}</span>
        <span class="profile-season-stats"><b>${s.total_points.toLocaleString()}</b> pts${s.rank ? ` &middot; Rank ${s.rank.toLocaleString()}` : ''}</span>
      </div>`).join('')
    : '<p class="profile-empty">No past-season FPL history on record yet.</p>';

    <div class="profile-total"><span>${seasons.length} season${seasons.length === 1 ? '' : 's'} of FPL history</span></div>

document.addEventListener('click', (e) => {
  const sortTh = e.target.closest('#standingsContent th[data-sort-key]');
  if (sortTh) {
    const league = currentStandingsLeague;
    const key = sortTh.dataset.sortKey;
    if (standingsSort[league].key === key) {
      standingsSort[league].dir = standingsSort[league].dir === 'asc' ? 'desc' : 'asc';
    } else {
      const col = STANDINGS_COLUMNS[league].find((c) => c.key === key);
      standingsSort[league] = { key, dir: col.dir };
    }
    renderStandingsTable();
    return;
  }
  const seasonEl = e.target.closest('.season-history-trigger');
  if (seasonEl) {
    renderSeasonHistoryProfile(seasonEl.dataset.entryId, seasonEl.textContent.trim());
    return;
  }
  const winnerCardEl = e.target.closest('.winner-card-trigger');
  if (winnerCardEl) {
    renderWinnerCard(winnerCardEl);
    return;
  }
  const nameEl = e.target.closest('.manager-profile-trigger');
  if (!nameEl) return;
  const name = nameEl.textContent.trim();
  if (name) renderManagerProfile(name);
});

function renderHallOfFame(entries) {
  if (!entries.length) return '';
  const topTier = entries.filter(([, count]) => count >= 3);
  const twoTier = entries.filter(([, count]) => count === 2);
  const oneTier = entries.filter(([, count]) => count === 1);

  let rank = 0;
  let lastCount = null;
  const topCards = topTier.map(([name, count]) => {
    if (count !== lastCount) { rank += 1; lastCount = count; }
    return hofCardHTML([name, count], rank);
  }).join('');
  const collapse = (tier, label) => {
    if (!tier.length) return '';
    const cards = tier.map((e) => hofCardHTML(e, null)).join('');
    return `<details class="hof-collapse">
      <summary>${label} (${tier.length})</summary>
      <article class="contest-card"><div class="hof-grid">${cards}</div></article>
    </details>`;
  };
  const podium = topTier.length
    ? `<article class="contest-card hof-podium"><div class="hof-grid">${topCards}</div></article>`
    : '';

  return `<div class="champ-wall-heading">Hall of Fame — Most Titles</div>
    <p class="champ-wall-note">Click a manager name for trophy details</p>
    ${podium}
    ${collapse(twoTier, 'TWO TITLES')}
    ${collapse(oneTier, 'ONE TITLE')}`;
}

function renderChampionsGroup(group) {
  const head = group.columns.map((c) => `<th>${escapeHTML(c)}</th>`).join('');
  const body = group.rows.map((row) => {
    const cells = row.map((val, i) => {
      if (i === 0) return `<td>${escapeHTML(val)}</td>`;
      if (i === 1) return `<td class="champ-cell">${escapeHTML(val)}</td>`;
      return `<td>${escapeHTML(val)}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');
  const note = group.note ? `<p class="champ-group-note">${escapeHTML(group.note)}</p>` : '';
  return `<article class="contest-card">
    <div class="card-title"><h2>${escapeHTML(group.title)}</h2></div>
    <table class="contest-table">
      <thead><tr>${head}</tr></thead>
      <tbody>${body}</tbody>
    </table>
    ${note}
  </article>`;
}

function renderChampions() {
  const clusters = CHAMPIONS_CLUSTERS.map((cluster) => `
    <div class="champ-cluster">
      <h3 class="champ-cluster-heading">${escapeHTML(cluster.heading)}</h3>
      <div class="contest-grid">${cluster.groups.map(renderChampionsGroup).join('')}</div>
    </div>`).join('');
  const hof = renderHallOfFame(computeHallOfFame(CHAMPIONS_CLUSTERS));
  document.getElementById('championsContent').innerHTML = `
    ${hof}
    ${clusters}`;
}

function standingsRowHTML(row, league) {
  const managerCell = `<button type="button" class="hof-name profile-trigger season-history-trigger" data-entry-id="${row.entry_id}">${escapeHTML(row.manager)}</button> <span class="contest-meta">(${escapeHTML(row.team_name)})</span>`;
  if (league === 'h2h') {
    return `<tr>
      <td>${row.rank}</td>
      <td>${managerCell}</td>
      <td class="standings-record">${row.matches_won}-${row.matches_drawn}-${row.matches_lost}</td>
      <td class="pts">${row.total_points}</td>
    </tr>`;
  }
  return `<tr>
    <td>${row.rank}</td>
    <td>${managerCell}</td>
    <td class="pts">${row.gw_points}</td>
    <td>${row.total_points}</td>
  </tr>`;
}

function renderStandingsTable() {
  const league = currentStandingsLeague;
  const rows = sortStandingsRows(standingsData[league] || [], league);
  const sort = standingsSort[league];
  const head = `<tr>${STANDINGS_COLUMNS[league].map((c) => {
    const active = c.key === sort.key;
    const arrow = active ? (sort.dir === 'asc' ? ' ▲' : ' ▼') : '';
    return `<th data-sort-key="${c.key}" class="sortable${active ? ' sorted' : ''}">${c.label}${arrow}</th>`;
  }).join('')}</tr>`;
  const body = rows.length
    ? rows.map((r) => standingsRowHTML(r, league)).join('')
    : '<tr><td colspan="4" class="empty">No standings data yet.</td></tr>';
  const gwLabel = standingsData.gw ? `Live Gameweek ${standingsData.gw} Standings` : 'Standings';
  document.getElementById('standingsContent').innerHTML = `
    <div class="champ-wall-heading">${gwLabel}</div>
    <table class="contest-table standings-table standings-table-${league}">
      <thead>${head}</thead>
      <tbody>${body}</tbody>
    </table>`;
}

        <div class="award-card-head">
          <span class="award-emblem">${awardIcon('centurion')}</span>
          <div class="award-heading">
            <span class="award-kicker">${escapeHTML(centKicker)}</span>
            <h2 class="award-title">First Centurion of the Year</h2>
            <div class="award-subtitle">First manager to reach 100 points</div>
          </div>
          <div class="award-status">${centBadges}</div>
        </div>
        <div class="award-winners">${centWinnerCards}</div>
        <div class="award-metrics">
          ${awardMetricHTML('points', centPointsLabel, centPoints)}
          ${awardMetricHTML('gw', centGameweekLabel, centGameweek)}
        </div>
      </article>
    </div>`;
}

function setSelectedTab(buttons, activeButton) {
  buttons.forEach((button) => {
    const selected = button === activeButton;
    button.classList.toggle('active', selected);
    button.setAttribute('aria-selected', String(selected));
    button.tabIndex = selected ? 0 : -1;
  });
}

function bindTabKeyboard(tablist) {
  tablist.addEventListener('keydown', (e) => {
    const current = e.target.closest('[role="tab"]');
    if (!current || !tablist.contains(current)) return;
    const tabs = [...tablist.querySelectorAll('[role="tab"]:not([disabled])')];
    const index = tabs.indexOf(current);
    let nextIndex = null;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextIndex = (index + 1) % tabs.length;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') nextIndex = (index - 1 + tabs.length) % tabs.length;
    if (e.key === 'Home') nextIndex = 0;
    if (e.key === 'End') nextIndex = tabs.length - 1;
    if (nextIndex === null) return;
    e.preventDefault();
    tabs[nextIndex].focus();
    tabs[nextIndex].click();
  });
}

function showLeague(league) {
  currentLeague = league;
  setSelectedTab([tabClassic, tabH2h], league === 'classic' ? tabClassic : tabH2h);
  if (currentPanel === 'knockout') {
    renderBracket(bracketContainer, bracketData[league]);
  }
}

function showPanel(panel) {
  currentPanel = panel;
  document.querySelectorAll('#mainTabs button[data-panel]').forEach((btn) => {
    const selected = btn.dataset.panel === panel;
    btn.classList.toggle('active', selected);
    btn.setAttribute('aria-selected', String(selected));
    btn.tabIndex = selected ? 0 : -1;
  });
  document.querySelectorAll('.panel').forEach((el) => {
    const selected = el.id === `panel-${panel}`;
    el.classList.toggle('active', selected);
    el.hidden = !selected;
  });
  if (panel === 'knockout') {
    renderBracket(bracketContainer, bracketData[currentLeague]);
  }
}

const mainTabsEl = document.getElementById('mainTabs');
mainTabsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-panel]');
  if (btn) {
    showPanel(btn.dataset.panel);
    if (MOBILE_MQ.matches) closeNavDrawer();
  }
});

tabClassic.addEventListener('click', () => showLeague('classic'));
tabH2h.addEventListener('click', () => showLeague('h2h'));

const tabStandingsClassic = document.getElementById('tabStandingsClassic');
const tabStandingsH2h = document.getElementById('tabStandingsH2h');
function showStandingsLeague(league) {
  currentStandingsLeague = league;
  setSelectedTab(
    [tabStandingsClassic, tabStandingsH2h],
    league === 'classic' ? tabStandingsClassic : tabStandingsH2h,
  );
  renderStandingsTable();
}
tabStandingsClassic.addEventListener('click', () => showStandingsLeague('classic'));
tabStandingsH2h.addEventListener('click', () => showStandingsLeague('h2h'));

const navToggle = document.getElementById('navToggle');
const navBackdrop = document.getElementById('navBackdrop');
let drawerPreviousFocus = null;
let drawerPreviousOverflow = '';

function setPanelsInert(inert) {
  document.querySelectorAll('.panel').forEach((panel) => panel.toggleAttribute('inert', inert));
}

function openNavDrawer() {
  drawerPreviousFocus = document.activeElement;
  drawerPreviousOverflow = document.body.style.overflow;
  mainTabsEl.classList.add('open');
  mainTabsEl.removeAttribute('inert');
  navBackdrop.classList.add('open');
  navBackdrop.setAttribute('aria-hidden', 'false');
  navToggle.setAttribute('aria-expanded', 'true');
  navToggle.setAttribute('aria-label', 'Close menu');
  setPanelsInert(true);
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => mainTabsEl.querySelector('[role="tab"][aria-selected="true"]')?.focus());
}
function closeNavDrawer({ restoreFocus = true } = {}) {
  mainTabsEl.classList.remove('open');
  mainTabsEl.toggleAttribute('inert', MOBILE_MQ.matches);
  navBackdrop.classList.remove('open');
  navBackdrop.setAttribute('aria-hidden', 'true');
  navToggle.setAttribute('aria-expanded', 'false');
  navToggle.setAttribute('aria-label', 'Open menu');
  setPanelsInert(false);
  document.body.style.overflow = drawerPreviousOverflow;
  if (restoreFocus) (drawerPreviousFocus || navToggle).focus();
  drawerPreviousFocus = null;
}
navToggle.addEventListener('click', () => {
  if (mainTabsEl.classList.contains('open')) closeNavDrawer();
  else openNavDrawer();
});
navBackdrop.addEventListener('click', closeNavDrawer);
document.addEventListener('keydown', (e) => {
  if (!mainTabsEl.classList.contains('open')) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    closeNavDrawer();
    return;
  }
  if (e.key !== 'Tab') return;
  const focusables = [navToggle, ...mainTabsEl.querySelectorAll('button:not([disabled])')];
  const index = focusables.indexOf(document.activeElement);
  if (e.shiftKey && index <= 0) {
    e.preventDefault();
    focusables.at(-1).focus();
  } else if (!e.shiftKey && index === focusables.length - 1) {
    e.preventDefault();
    focusables[0].focus();
  }
});
MOBILE_MQ.addEventListener('change', (e) => {
  if (!e.matches) closeNavDrawer({ restoreFocus: false });
  else mainTabsEl.toggleAttribute('inert', !mainTabsEl.classList.contains('open'));
  if (currentPanel === 'knockout') renderBracket(bracketContainer, bracketData[currentLeague]);
});

[mainTabsEl, document.getElementById('standingsTabs'), document.getElementById('knockoutTabs')].forEach(bindTabKeyboard);
mainTabsEl.toggleAttribute('inert', MOBILE_MQ.matches);

async function loadJson(path) {
  try {
    const res = await fetch(path);
    return res.ok ? res.json() : null;
  } catch {
    return null;
  }
}

const STALE_MS = 20 * 60 * 1000; // no successful GW-live refresh should take longer than this
// Mirrors FPL.PY's POLL_DEADLINE_BUFFER — before this window, the tracker is
// intentionally idle (GW finalized, next deadline still far off), so a big
// "Updated X ago" gap there is expected, not a sign the pipeline is stuck.
const POLL_DEADLINE_BUFFER_MS = 60 * 60 * 1000;
const updatedAtEl = document.getElementById('updatedAt');

function formatDeadline(iso) {
  return new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function renderUpdatedAt(generatedAt, nextDeadline, currentGwFinalized) {
  if (!generatedAt) { updatedAtEl.textContent = ''; return; }
  const genTime = new Date(generatedAt);
  const ageMs = Date.now() - genTime.getTime();
  const mins = Math.max(0, Math.round(ageMs / 60000));
  const hours = Math.round(mins / 60);
  const days = Math.round(hours / 24);
  const label = mins < 1 ? 'just now'
    : mins < 60 ? `${mins} min ago`
    : hours < 24 ? `${hours} hour${hours === 1 ? '' : 's'} ago`
    : `${days} day${days === 1 ? '' : 's'} ago`;

  const deadlineMs = nextDeadline ? new Date(nextDeadline).getTime() : null;
  // Only meaningful once the current GW is actually finished — while it's
  // still live, updates are ongoing no matter how far off the next deadline is.
  const idleByDesign = currentGwFinalized === true && deadlineMs !== null && Date.now() < deadlineMs - POLL_DEADLINE_BUFFER_MS;

  if (idleByDesign) {
    updatedAtEl.textContent = `Updated ${label} · next update near ${formatDeadline(nextDeadline)}`;
    updatedAtEl.classList.remove('stale');
  } else {
    updatedAtEl.textContent = `Updated ${label}`;
    updatedAtEl.classList.toggle('stale', ageMs > STALE_MS);
  }
}

let stateLoading = false;
let lastGeneratedAt = null;
let lastNextDeadline = null;
let lastCurrentGwFinalized = null;
async function loadState() {
  if (stateLoading) return;
  stateLoading = true;
  const bust = `?t=${Date.now()}`;
  try {
    const [classic, h2h, contests, standings] = await Promise.all([
      loadJson(`data/bracket_state_classic.json${bust}`),
      loadJson(`data/bracket_state_h2h.json${bust}`),
      loadJson(`data/contests.json${bust}`),
      loadJson(`data/standings_current.json${bust}`),
    ]);
    if (classic) bracketData.classic = classic;
    if (h2h) bracketData.h2h = h2h;
    if (standings) {
      standingsData = standings;
      renderStandingsTable();
    }
    if (contests) {
      renderMow(contests);
      renderMom(contests);
      renderKing(contests);
      lastGeneratedAt = contests.generated_at || lastGeneratedAt;
      lastNextDeadline = contests.next_deadline ?? lastNextDeadline;
      lastCurrentGwFinalized = contests.current_gw_finalized ?? lastCurrentGwFinalized;
    }
    showPanel(currentPanel);
    renderUpdatedAt(lastGeneratedAt, lastNextDeadline, lastCurrentGwFinalized);
  } finally {
    stateLoading = false;
  }
}

window.addEventListener('resize', () => {
  if (currentPanel !== 'knockout') return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => showLeague(currentLeague), 120);
});

loadJson('data/season_history.json').then((d) => { if (d) seasonHistoryData = d; });
renderRules();
loadJson('data/champions_history.json').then((d) => {
  if (!d) return;
  CHAMPIONS_CLUSTERS = d;
  renderChampions();
});
loadState();
setInterval(() => {
  if (!document.hidden) loadState();
}, 60_000);
setInterval(() => renderUpdatedAt(lastGeneratedAt, lastNextDeadline, lastCurrentGwFinalized), 30_000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadState();
});
</script>
